<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math Logic — 3D Arcade</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#f4f7ff;font:16px system-ui,Arial;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:linear-gradient(100deg,#101a2b,#172b43);border-bottom:1px solid #293a55}
.logo{font-size:22px;font-weight:900;letter-spacing:1px}
.logo span{color:#50d9ff}
#menu{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:#0d1524;z-index:2}
button{border:1px solid #405575;background:#1a2b43;color:white;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}
button:hover,button.active{background:#147ca4;border-color:#62dfff}
#status{padding:8px 16px;background:#101a2b;color:#b9cce7;font-size:14px;min-height:38px}
#game{flex:1;min-height:0;position:relative;background:#05080d}
canvas{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#message{background:#0b1424dd;border:1px solid #4c6688;border-radius:16px;padding:18px 24px;text-align:center;max-width:520px;box-shadow:0 12px 50px #0008}
#message h2{margin:0 0 8px;font-size:25px}
#message p{margin:5px 0;color:#d1def2}
@media(max-width:650px){
header{height:54px}
#menu{gap:5px}
button{padding:8px;font-size:12px}
#status{font-size:12px}
}
</style>
</head>
<body>
<div id="app">
<header>
<div class="logo">MATH <span>LOGIC</span> ARCADE</div>
<div>3D GAME ZONE</div>
</header>
<nav id="menu">
<button data-game="tag">🏃 Tag Arena</button>
<button data-game="race">🏎 Street Racer</button>
<button data-game="zombie">🧟 Zombie Survival</button>
<button data-game="soccer">⚽ Pro Soccer</button>
<button data-game="parkour">🧗 Rooftop Parkour</button>
<button data-game="battle">🎯 Battle Arena</button>
<button id="reset">↻ Restart</button>
</nav>
<div id="status">Choose a game above. All games run inside this page.</div>
<main id="game">
<div id="overlay">
<div id="message">
<h2>Welcome to Math Logic</h2>
<p>Choose one of the six games to start playing.</p>
<p>WASD / arrows to move · Space to jump · Mouse click to shoot</p>
</div>
</div>
</main>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const host=document.querySelector('#game');
const status=document.querySelector('#status');
const overlay=document.querySelector('#overlay');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91b9d5);
scene.fog=new THREE.Fog(0x91b9d5,42,115);

const camera=new THREE.PerspectiveCamera(65,1,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
renderer.outputColorSpace=THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe5f5ff,0x526044,2.25));
const fillLight=new THREE.DirectionalLight(0xb9dcff,.65);
fillLight.position.set(16,10,-18);
scene.add(fillLight);

const sun=new THREE.DirectionalLight(0xffffff,2.4);
sun.position.set(-12,24,14);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const mat=(color,roughness=.8)=>new THREE.MeshStandardMaterial({color,roughness});
const materials={
grass:mat(0x477c48),road:mat(0x343b48),line:mat(0xf4d65c),
blue:mat(0x168bdf),red:mat(0xe94b4b),gold:mat(0xffc247),
dark:mat(0x263448),white:mat(0xf2f4f8),
zombie:mat(0x6b9d55),building:mat(0x78889a)
};

let game='';
let objects=[],players=[],enemies=[],projectiles=[],keys={};
let clock=new THREE.Clock(),time=0,score=0,roundOver=false,tagger=0;
let ball=null,car=null,velocity=0,jumpV=0,groundY=0,player=null,tagPlatforms=[];

function add(mesh){scene.add(mesh);objects.push(mesh);return mesh}

function box(x,y,z,sx,sy,sz,material,cast=true){
let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
m.position.set(x,y,z);
m.castShadow=cast;
m.receiveShadow=true;
return add(m);
}

function sphere(x,y,z,r,material){
let m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),material);
m.position.set(x,y,z);
m.castShadow=true;
return add(m);
}

function clear(){
for(const o of objects)scene.remove(o);
objects=[];players=[];enemies=[];projectiles=[];tagPlatforms=[];
ball=null;car=null;player=null;score=0;time=0;
roundOver=false;velocity=0;jumpV=0;groundY=0;tagger=0;
}

function floor(color=0x477c48,w=60,d=60){
box(0,-.35,0,w,.7,d,mat(color),false);
}

function person(color,x,z){
const g=new THREE.Group();
const cloth=mat(color);
const skin=mat(0xd9a783);
const shoe=mat(0x202630);
const trim=mat(0xe8eef6);

if(color===0x00cfff){
cloth.emissive=new THREE.Color(0x007da8);
cloth.emissiveIntensity=1.15;
cloth.metalness=.18;
cloth.roughness=.28;
}

const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.36,.62,6,12),cloth);
torso.position.y=1.12;
torso.castShadow=true;
g.add(torso);

const head=new THREE.Mesh(new THREE.SphereGeometry(.25,20,16),skin);
head.position.y=1.88;
head.castShadow=true;
g.add(head);

const hair=new THREE.Mesh(new THREE.SphereGeometry(.255,16,10,0,Math.PI*2,0,Math.PI*.48),mat(0x30251f));
hair.position.y=2.0;
g.add(hair);

const eyeMat=mat(0x17202b);
for(const xEye of [-.09,.09]){
const eye=new THREE.Mesh(new THREE.SphereGeometry(.025,8,8),eyeMat);
eye.position.set(xEye,1.9,.225);
g.add(eye);
}

const limbs=[];
for(const side of [-1,1]){
const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.105,.48,4,8),cloth);
arm.position.set(side*.43,1.18,0);
arm.rotation.z=side*.12;
arm.castShadow=true;
g.add(arm);
limbs.push(arm);

const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.52,4,8),mat(0x263344));
leg.position.set(side*.17,.48,0);
leg.castShadow=true;
g.add(leg);
limbs.push(leg);

const foot=new THREE.Mesh(new THREE.BoxGeometry(.22,.13,.34),shoe);
foot.position.set(side*.17,.13,.07);
g.add(foot);
}

const belt=new THREE.Mesh(new THREE.TorusGeometry(.28,.035,6,20),trim);
belt.rotation.x=Math.PI/2;
belt.position.y=.78;
g.add(belt);

g.userData.limbs=limbs;
g.userData.phase=Math.random()*6;
g.position.set(x,0,z);
scene.add(g);
objects.push(g);
return g;
}

function litBuilding(x,z,w,h,d,base=0x53677b,glow=0xffd27a){
const b=box(x,h/2,z,w,h,d,mat(base,.92));
const rows=Math.max(2,Math.floor(h/2.2));
const cols=Math.max(2,Math.floor(w/1.25));

for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
const wx=x-w/2+(c+.5)*w/cols;
const wy=1+(r+.5)*(h-1)/rows;
const win=box(wx,wy,z-d/2-.035,w/cols*.48,.55,.07,mat((r+c)%4===0?glow:0x9dbbd0,.35),false);
win.material.emissive=new THREE.Color((r+c)%4===0?glow:0x263b50);
win.material.emissiveIntensity=(r+c)%4===0?.42:.08;
}
return b;
}

function streetLamp(x,z,color=0xffdf9a){
box(x,3,z,.13,6,.13,mat(0x26313c));
box(x+.55,5.7,z,.95,.12,.12,mat(0x26313c));
const bulb=sphere(x+.95,5.62,z,.2,mat(color,.25));
bulb.material.emissive=new THREE.Color(color);
bulb.material.emissiveIntensity=1.3;
const light=new THREE.PointLight(color,1.5,12);
light.position.set(x+.95,5.4,z);
add(light);
}

function tree(x,z){
box(x,.9,z,.35,1.8,.35,mat(0x62452d));
const crown=sphere(x,2.8,z,1.35,mat(0x24583c));
crown.scale.y=1.25;
}

function setMood(bg,fog,exposure=1.12){
scene.background=new THREE.Color(bg);
scene.fog=new THREE.Fog(fog,35,125);
renderer.toneMappingExposure=exposure;
}

function neonStrip(x,y,z,w,color){
const m=box(x,y,z,w,.08,.08,mat(color,.25),false);
m.material.emissive=new THREE.Color(color);
m.material.emissiveIntensity=1.8;
}

function setupCamera(x=0,y=18,z=24){
camera.position.set(x,y,z);
camera.lookAt(0,0,0);
}

function say(title,txt){
overlay.style.display='flex';
document.querySelector('#message').innerHTML=`<h2>${title}</h2><p>${txt}</p>`;
clearTimeout(window._introTimer);
window._introTimer=setTimeout(hideMessage,4500);
}

function hideMessage(){overlay.style.display='none'}

function start(name){
game=name;
clear();
hideMessage();
document.querySelectorAll('[data-game]').forEach(b=>b.classList.toggle('active',b.dataset.game===name));
if(name==='tag')startTag();
if(name==='race')startRace();
if(name==='zombie')startZombie();
if(name==='soccer')startSoccer();
if(name==='parkour')startParkour();
if(name==='battle')startBattle();
updateStatus();
}

function updateStatus(){
const help={
tag:'3 PLAYERS · P1 WASD (W jumps) · P2 ARROWS (↑ jumps) · P3 JKL + I jumps · Blue player is neon.',
race:'W / ↑ accelerate · S / ↓ brake · A,D / ←,→ steer · Space handbrake.',
zombie:'WASD / arrows move · Space jumps · Mouse click shoots · Survive the waves.',
soccer:'WASD / arrows move · Space jumps · E kicks the ball.',
parkour:'WASD / arrows move · Space jumps · Reach the glowing finish
