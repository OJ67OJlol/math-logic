<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Logic</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101426;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:25px;background:#19213b}
h1{color:#65e6ff;margin:0;font-size:38px}
main{max-width:1100px;margin:auto;padding:20px}
input{padding:13px;border-radius:8px;border:0;font-size:17px;margin:8px}
button{padding:12px 18px;border:0;border-radius:8px;background:#26c6da;color:#071321;font-weight:bold;cursor:pointer;margin:5px}
button:hover{background:#72edff}
#library{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px;margin-top:25px}
.game{background:#202b49;padding:20px;border-radius:12px}
.game h3{margin:8px}
.game p{color:#c8d6ed;font-size:13px;min-height:34px}
#playArea{display:none;margin-top:20px}
canvas{background:#080d1b;border:3px solid #65e6ff;border-radius:10px;width:100%;max-width:850px;height:auto;touch-action:none}
#status{font-size:18px;margin:12px}
.small{color:#b9c9e8;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🎮 Math Logic</h1>
<p>Play games right here!</p>
</header>
<main>
<section id="login">
<h2>Unlock Math Logic</h2>
<p>Enter your secret code to access the games.</p>
<input id="secret" type="password" placeholder="Enter code">
<button onclick="unlock()">UNLOCK</button>
<p id="message"></p>
</section>

<section id="gamesSection" style="display:none">
<h2>Game Library</h2>
<input id="search" placeholder="Search games..." oninput="showGames()">
<div id="library"></div>
</section>

<section id="playArea">
<h2 id="gameTitle"></h2>
<p id="instructions" class="small"></p>
<div id="status">Good luck!</div>
<canvas id="gameCanvas" width="850" height="480"></canvas>
<br>
<button onclick="restartGame()">↻ Restart</button>
<button onclick="backToGames()">← Back to games</button>
</section>
</main>

<script>
const games=[
["Battle Zone","Arena battle: move and shoot."],
["Neon Snake","Collect food and grow longer."],
["Turbo Trials","Drive through an obstacle course."],
["Hoops Pro","Move and shoot baskets."],
["Neon Dash","Jump over obstacles."],
["Tag Game","Three players chase each other!"],
["Maze Runner","Find your way through the maze."],
["Space Defender","Dodge and shoot incoming enemies."],
["Pixel Racer","Race and avoid other cars."]
];

let currentGame="";
let keys={};
let state={};
let animation;
let lastTime=0;
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

function unlock(){
 if(document.getElementById("secret").value==="6767"){
  document.getElementById("login").style.display="none";
  document.getElementById("gamesSection").style.display="block";
  showGames();
 }else{
  document.getElementById("message").textContent="Wrong code. Try again!";
 }
}

function showGames(){
 const search=document.getElementById("search").value.toLowerCase();
 const library=document.getElementById("library");
 library.innerHTML="";
 games.forEach((g,i)=>{
  if(!g[0].toLowerCase().includes(search))return;
  const card=document.createElement("div");
  card.className="game";
  const title=document.createElement("h3");
  title.textContent="🎮 "+g[0];
  const description=document.createElement("p");
  description.textContent=g[1];
  const button=document.createElement("button");
  button.textContent="PLAY NOW";
  button.onclick=()=>startGame(g[0]);
  card.append(title,description,button);
  library.appendChild(card);
 });
}

function startGame(name){
 currentGame=name;
 document.getElementById("gamesSection").style.display="none";
 document.getElementById("playArea").style.display="block";
 document.getElementById("gameTitle").textContent=name;
 const instructions={
  "Battle Zone":"Move with WASD or arrow keys. Press SPACE to shoot.",
  "Neon Snake":"Move with WASD or arrow keys. Collect the food.",
  "Turbo Trials":"Use A/D or arrow keys to steer. W to accelerate.",
  "Hoops Pro":"Move with A/D or arrows. Press SPACE to shoot.",
  "Neon Dash":"Press SPACE, W, or UP to jump.",
  "Tag Game":"P1: WASD | P2: Arrow keys | P3: I J K L. Tag the other players!",
  "Maze Runner":"Use WASD or arrow keys to reach the green exit.",
  "Space Defender":"Move with WASD or arrows. Press SPACE to fire.",
  "Pixel Racer":"Use A/D or arrow keys to steer. Avoid other cars."
 };
 document.getElementById("instructions").textContent=instructions[name];
 restartGame();
}

function restartGame(){
 cancelAnimationFrame(animation);
 keys={};
 state={score:0,over:false,time:0};
 if(currentGame==="Tag Game"){
  state.players=[
   {x:100,y:100,color:"#ff5577",name:"P1",controls:"wasd"},
   {x:420,y:240,color:"#55d9ff",name:"P2",controls:"arrows"},
   {x:700,y:370,color:"#ffe15c",name:"P3",controls:"ijkl"}
  ];
  state.tagged=0;
 }else if(currentGame==="Neon Snake"){
  state.snake=[{x:10,y:10}];
  state.dx=1;state.dy=0;
  state.food={x:18,y:10};
  state.tick=0;
 }else if(currentGame==="Maze Runner"){
  state.player={x:35,y:35};
  state.walls=[
   [100,0,20,300],[200,180,20,300],[300,0,20,300],
   [400,180,20,300],[500,0,20,300],[600,180,20,300],
   [700,0,20,300]
  ];
 }else if(currentGame==="Hoops Pro"){
  state.player={x:420,y:390};
  state.ball=null;
  state.baskets=0;
 }else{
  state.player={x:420,y:390};
  state.items=[];
  state.jump=0;
  state.velocity=0;
  state.spawn=0;
 }
 draw();
 lastTime=0;
 animation=requestAnimationFrame(loop);
}

function backToGames(){
 cancelAnimationFrame(animation);
 document.getElementById("playArea").style.display="none";
 document.getElementById("gamesSection").style.display="block";
 keys={};
}

window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
 keys[k]=true;
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function down(...list){return list.some(k=>keys[k])}
function move(p,left,right,up,downKey,speed=4){
 if(down(left))p.x-=speed;
 if(down(right))p.x+=speed;
 if(down(up))p.y-=speed;
 if(down(downKey))p.y+=speed;
 p.x=Math.max(15,Math.min(835,p.x));
 p.y=Math.max(15,Math.min(465,p.y));
}
function rect(x,y,w,h,color){
 ctx.fillStyle=color;ctx.fillRect(x,y,w,h);
}
function circle(x,y,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function text(t,x,y,size=20,color="white"){
 ctx.fillStyle=color;ctx.font="bold "+size+"px Arial";ctx.fillText(t,x,y);
}

function loop(t){
 if(!lastTime)lastTime=t;
 let dt=Math.min((t-lastTime)/16,2);
 lastTime=t;
 update(dt);
 draw();
 animation=requestAnimationFrame(loop);
}

function update(dt){
 state.time+=dt;
 const p=state.player;
 if(currentGame==="Tag Game"){
  const ps=state.players;
  move(ps[0],"a","d","w","s",3.5*dt);
  move(ps[1],"arrowleft","arrowright","arrowup","arrowdown",3.5*dt);
  move(ps[2],"j","l","i","k",3.5*dt);
  const tagged=ps[state.tagged];
  for(let i=0;i<3;i++){
   if(i!==state.tagged){
    const other=ps[i];
    if(Math.hypot(tagged.x-other.x,tagged.y-other.y)<32){
     state.tagged=i;
     document.getElementById("status").textContent=ps[i].name+" is IT! Keep chasing!";
    }
   }
  }
  return;
 }

 if(currentGame==="Neon Snake"){
  state.tick+=dt;
  if(down("w","arrowup")){state.dx=0;state.dy=-1}
  if(down("s","arrowdown")){state.dx=0;state.dy=1}
  if(down("a","arrowleft")){state.dx=-1;state.dy=0}
  if(down("d","arrowright")){state.dx=1;state.dy=0}
  if(state.tick>7){
   state.tick=0;
   let head={x:state.snake[0].x+state.dx,y:state.snake[0].y+state.dy};
   head.x=(head.x+30)%30;head.y=(head.y+16)%16;
   state.snake.unshift(head);
   if(head.x===state.food.x&&head.y===state.food.y){
    state.score++;
    state.food={x:Math.floor(Math.random()*30),y:Math.floor(Math.random()*16)};
   }else state.snake.pop();
   if(state.snake.slice(1).some(s=>s.x===head.x&&s.y===head.y)){
    state.snake=[{x:10,y:10}];state.score=0;
   }
  }
  return;
 }

 if(currentGame==="Maze Runner"){
  move(p,"a","d","w","s",3*dt);
  for(const w of state.walls){
   if(p.x+12>w[0]&&p.x-12<w[0]+w[2]&&p.y+12>w[1]&&p.y-12<w[1]+w[3]){
    if(down("a","arrowleft"))p.x+=3*dt;
    if(down("d","arrowright"))p.x-=3*dt;
    if(down("w","arrowup"))p.y+=3*dt;
    if(down("s","arrowdown"))p.y-=3*dt;
   }
  }
  if(p.x>800&&p.y>400){
   document.getElementById("status").textContent="You escaped the maze! 🎉";
  }
  return;
 }

 if(currentGame==="Hoops Pro"){
  move(p,"a","d","w","s",4*dt);
  if(down(" ","enter")&&!state.ball){
   state.ball={x:p.x,y:p.y-15,vx:(420-p.x)*.025,vy:-9};
  }
  if(state.ball){
   state.ball.x+=state.ball.vx*dt;
   state.ball.y+=state.ball.vy*dt;
   state.ball.vy+=.25*dt;
   if(state.ball.y<75&&state.ball.x>365&&state.ball.x<485){
    state.baskets++;state.ball=null;
   }else if(state.ball.y>480)state.ball=null;
  }
  return;
 }

 if(currentGame==="Battle Zone"||currentGame==="Space Defender"){
  move(p,"a","d","w","s",4*dt);
  state.spawn+=dt;
  if(down(" ")&&state.spawn>8){
   state.spawn=0;
   state.items.push({x:p.x,y:p.y-15,v:-8,shot:true});
  }
  if(state.items.filter(i=>!i.shot).length<5&&Math.random()<.025*dt){
   state.items.push({x:Math.random()*800+20,y:-10,v:2+Math.random()*2});
  }
  state.items.forEach(i=>i.y+=i.v*dt);
  for(const i of state.items){
   if(i.shot){
    for(const enemy of state.items){
     if(!enemy.shot&&Math.hypot(i.x-enemy.x,i.y-enemy.y)<18){
      enemy.dead=true;i.dead=true;state.score++;
     }
    }
   }else if(Math.hypot(i.x-p.x,i.y-p.y)<22){
    i.dead=true;state.score=Math.max(0,state.score-1);
   }
  }
  state.items=state.items.filter(i=>!i.dead&&i.y<500&&i.y>-30);
  return;
 }

 if(currentGame==="Turbo Trials"||currentGame==="Pixel Racer"){
  if(down("a","arrowleft"))p.x-=5*dt;
  if(down("d","arrowright"))p.x+=5*dt;
  p.x=Math.max(60,Math.min(790,p.x));
  state.spawn+=dt;
  if(state.spawn>22){
   state.spawn=0;
   state.items.push({x:80+Math.random()*690,y:-40});
  }
  state.items.forEach(i=>i.y+=(currentGame==="Turbo Trials"?5:7)*dt);
  state.items=state.items.filter(i=>i.y<520);
  state.items.forEach(i=>{
   if(Math.abs(i.x-p.x)<38&&Math.abs(i.y-400)<45){
    state.score=0;
    i.y=600;
   }
  });
  state.score+=.03*dt;
  return;
 }

 if(currentGame==="Neon Dash"){
  if(down(" ","w","arrowup")&&p.y>=390)p.vy=-11;
  p.vy=(p.vy||0)+.5*dt;
  p.y+=p.vy*dt;
  if(p.y>390){p.y=390;p.vy=0}
  state.spawn+=dt;
  if(state.spawn>55){
   state.spawn=0;state.items.push({x:850,y:400});
  }
  state.items.forEach(i=>i.x-=6*dt);
  state.items=state.items.filter(i=>i.x>-30);
  state.items.forEach(i=>{
   if(Math.abs(i.x-p.x)<25&&p.y>360)state.score=0;
  });
  state.score+=.05*dt;
 }
}

function draw(){
 ctx.clearRect(0,0,850,480);
 rect(0,440,850,40,"#18243c");
 if(currentGame==="Tag Game"){
  state.players.forEach((p,i)=>{
   circle(p.x,p.y,19,p.color);
   text(p.name,p.x-14,p.y-28,14);
   if(i===state.tagged)text("IT!",p.x-10,p.y+42,16,"#ff7777");
  });
  text("TAG THE OTHER PLAYERS!",250,35,25);
  text("P1: WASD     P2: ARROWS     P3: I J K L",180,465,16);
 }else if(currentGame==="Neon Snake"){
  state.snake.forEach((s,i)=>rect(s.x*28+1,s.y*28+1,25,25,i?"#36c9a0":"#b6ff70"));
  circle(state.food.x*28+14,state.food.y*28+14,10,"#ff5577");
  text("Score: "+state.score,15,25);
 }else if(currentGame==="Maze Runner"){
  state.walls.forEach(w=>rect(...w,"#637da9"));
  rect(790,410,40,40,"#43e68c");
  circle(state.player.x,state.player.y,13,"#ffdc5e");
  text("Find the green exit!",20,25);
 }else if(currentGame==="Hoops Pro"){
  rect(350,55,150,12,"#f2a65a");
  circle(425,65,23,"#ffcc55");
  rect(390,80,70,8,"#ff5577");
  circle(state.player.x,state.player.y,15,"#53dfff");
  if(state.ball)circle(state.ball.x,state.ball.y,9,"#ff9c42");
  text("Baskets: "+state.baskets,20,30);
 }else if(currentGame==="Battle Zone"||currentGame==="Space Defender"){
  state.items.forEach(i=>circle(i.x,i.y,i.shot?5:14,i.shot?"#fff":"#ff5577"));
  circle(state.player.x,state.player.y,17,"#52e4ff");
  text("Score: "+state.score,20,30);
 }else if(currentGame==="Turbo Trials"||currentGame==="Pixel Racer"){
  rect(200,0,450,480,"#202b3e");
  rect(410,0,8,480,"#f5e8a5");
  for(let y=0;y<480;y+=60)rect(418,y,5,30,"white");
  state.items.forEach(i=>rect(i.x-17,i.y-25,34,50,"#ff5577"));
  rect(state.player.x-20,375,40,60,"#55dfff");
  text("Score: "+Math.floor(state.score),20,30);
 }else if(currentGame==="Neon Dash"){
  rect(0,420,850,20,"#384e70");
  state.items.forEach(i=>rect(i.x,370,25,50,"#ff5577"));
  rect(state.player.x-15,state.player.y-30,30,30,"#58e5ff");
  text("Score: "+Math.floor(state.score),20,30);
 }
 document.getElementById("status").textContent=
  currentGame==="Tag Game"?"Player "+(state.tagged+1)+" is IT!":
  currentGame==="Neon Snake"?"Score: "+state.score:
  currentGame==="Hoops Pro"?"Baskets: "+state.baskets:
  "Score: "+Math.floor(state.score||0);
}
</script>
</body>
</html>
