<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Logic</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #10152b;
    color: white;
    text-align: center;
}

header {
    background: #202b50;
    padding: 25px;
}

h1 {
    color: #55e6ff;
    font-size: 38px;
}

main {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

input, button {
    padding: 12px;
    border: 0;
    border-radius: 8px;
    margin: 5px;
    font-size: 16px;
}

input {
    max-width: 90%;
}

button {
    background: #20c9e8;
    color: #071323;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #75efff;
}

#games {
    display: none;
}

.game-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 12px;
    margin: 25px 0;
}

.game-card {
    background: #202b50;
    border: 1px solid #435783;
    border-radius: 12px;
    padding: 18px 10px;
}

.game-card button {
    width: 100%;
}

#player {
    display: none;
    margin-top: 25px;
    background: #202b50;
    padding: 15px;
    border-radius: 12px;
}

iframe {
    width: 100%;
    height: 600px;
    border: 0;
    border-radius: 10px;
    background: black;
}

#message {
    color: #ffcc66;
}

footer {
    padding: 25px;
    color: #aab7d8;
}
</style>
</head>

<body>

<header>
    <h1>Math Logic</h1>
    <p>Math • Learning • Games • Fun</p>
</header>

<main>

    <h2>Calculator</h2>
    <input id="calc" placeholder="Example: 10+5">
    <button onclick="calculate()">Calculate</button>
    <p id="answer"></p>

    <hr>

    <h2>Unlock Games</h2>
    <p>Enter the secret code to open the games.</p>

    <input id="secret" type="password" placeholder="Enter secret code">
    <button onclick="unlock()">Unlock</button>

    <p id="message"></p>

    <section id="games">
        <h2>🎮 Game Library</h2>

        <input
            id="search"
            placeholder="Search for a game..."
            oninput="searchGames()"
        >

        <div class="game-list" id="gameList"></div>
    </section>

    <section id="player">
        <h2 id="gameTitle">Game Player</h2>

        <iframe
            id="gameFrame"
            allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
            allowfullscreen>
        </iframe>

        <p id="playerMessage">
            If the game does not load, the game provider may block embedding.
        </p>

        <button onclick="openGameInNewTab()">Open Game in New Tab</button>
        <button onclick="closeGame()">Close Game</button>
        <button onclick="document.getElementById('gameFrame').requestFullscreen()">
            Fullscreen
        </button>
    </section>

</main>

<footer>
    Math Logic © 2026
</footer>

<script>
const games = [
    { name: "Ski Frenzy", code: "2034", url: "https://www.crazygames.com/game/ski-frenzy" },
    { name: "Kour.io", code: "2036", url: "https://kour.io/" },
    { name: "Basketball Legends", code: "2040", url: "https://www.crazygames.com/game/basketball-legends-2020" },
    { name: "Krunker", code: "2060", url: "https://krunker.io/" },
    { name: "Shell Shockers", code: "2062", url: "https://shellshock.io/" },
    { name: "Drive Mad", code: "4018", url: "https://www.crazygames.com/game/drive-mad" },
    { name: "Geometry Dash", code: "4024", url: "https://www.crazygames.com/game/geometry-dash-online" },
    { name: "Slither.io", code: "4049", url: "https://slither.io/" },
    { name: "Subway Surfers", code: "4056", url: "https://poki.com/en/g/subway-surfers" },
    { name: "Retro Bowl", code: "4042", url: "https://www.crazygames.com/game/retro-bowl" },
    { name: "Minecraft", code: "3011", url: "https://classic.minecraft.net/" },
    { name: "Granny", code: "3003", url: "https://www.crazygames.com/game/granny" }
];

let currentGameUrl = "";

function calculate() {
    const expression = document.getElementById("calc").value;
    const answer = document.getElementById("answer");

    if (!/^[0-9+\-*/().\s]+$/.test(expression)) {
        answer.textContent = "Please enter a valid math problem.";
        return;
    }

    try {
        const result = Function('"use strict"; return (' + expression + ')')();
        answer.textContent = "Answer: " + result;
    } catch {
        answer.textContent = "That calculation is not valid.";
    }
}

function unlock() {
    const code = document.getElementById("secret").value;

    if (code === "6767") {
        document.getElementById("games").style.display = "block";
        document.getElementById("message").textContent = "Games unlocked!";
        showGames(games);
    } else {
        document.getElementById("message").textContent = "Wrong code. Try again.";
    }
}

function showGames(list) {
    const gameList = document.getElementById("gameList");
    gameList.innerHTML = "";

    list.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";

        const title = document.createElement("h3");
        title.textContent = game.name;

        const code = document.createElement("p");
        code.textContent = "Code: " + game.code;

        const button = document.createElement("button");
        button.textContent = "PLAY";
        button.onclick = () => playGame(game);

        card.append(title, code, button);
        gameList.appendChild(card);
    });
}

function searchGames() {
    const search = document.getElementById("search").value.toLowerCase();

    const filtered = games.filter(game =>
        game.name.toLowerCase().includes(search) ||
        game.code.includes(search)
    );

    showGames(filtered);
}

function playGame(game) {
    currentGameUrl = game.url;

    document.getElementById("gameTitle").textContent = game.name;
    document.getElementById("gameFrame").src = game.url;
    document.getElementById("player").style.display = "block";

    document.getElementById("player").scrollIntoView({
        behavior: "smooth"
    });
}

function openGameInNewTab() {
    if (currentGameUrl) {
        window.open(currentGameUrl, "_blank", "noopener");
    }
}

function closeGame() {
    document.getElementById("gameFrame").src = "about:blank";
    document.getElementById("player").style.display = "none";
    currentGameUrl = "";
}
</script>

</body>
</html>
